[project]
name = "file-sharing-website"
version = "0.1.0"
description = ""
authors = [
    {name = "backstab999"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]
